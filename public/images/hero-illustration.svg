<svg width="560" height="480" viewBox="0 0 560 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of legal scales, law books and a gavel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F8FC"/>
      <stop offset="1" stop-color="#E4ECF7"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E5AA8"/>
      <stop offset="1" stop-color="#0B2341"/>
    </linearGradient>
  </defs>

  <rect width="560" height="480" rx="18" fill="url(#bg)"/>
  <circle cx="470" cy="70" r="120" fill="#1E5AA8" fill-opacity="0.07"/>
  <circle cx="70" cy="420" r="140" fill="#E53935" fill-opacity="0.07"/>
  <circle cx="510" cy="430" r="70" fill="#1E5AA8" fill-opacity="0.06"/>

  <!-- Books on the left -->
  <rect x="46" y="300" width="150" height="26" rx="6" fill="#1E5AA8"/>
  <rect x="56" y="274" width="130" height="26" rx="6" fill="#0B2341"/>
  <rect x="66" y="248" width="110" height="26" rx="6" fill="#E53935"/>
  <path d="M96 248 v-26 h8 l12 16 h-20z" fill="#ffb4a2" opacity="0.0"/>

  <!-- Graduation cap on book stack -->
  <g transform="translate(118 214)">
    <path d="M-26 12 L0 -8 L26 12 L0 32 Z" fill="#0B2341"/>
    <rect x="-26" y="12" width="52" height="10" rx="3" fill="#1E5AA8"/>
    <circle cx="0" cy="30" r="5" fill="#E53935"/>
    <path d="M 18 16 L 58 34" stroke="#0B2341" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Justice scales -->
  <g>
    <rect x="262" y="120" width="36" height="190" rx="10" fill="url(#pillar)"/>
    <rect x="102" y="142" width="356" height="20" rx="10" fill="#1E5AA8"/>
    <circle cx="280" cy="112" r="16" fill="#E53935"/>
    <circle cx="280" cy="112" r="7" fill="#ffffff"/>

    <!-- left assembly -->
    <line x1="130" y1="162" x2="158" y2="238" stroke="#0B2341" stroke-width="6" stroke-linecap="round"/>
    <line x1="130" y1="162" x2="102" y2="238" stroke="#0B2341" stroke-width="6" stroke-linecap="round"/>
    <path d="M84 238 h92 v12 a46 12 0 0 1 -92 0z" fill="#0b2341"/>
    <ellipse cx="130" cy="250" rx="46" ry="11" fill="#1E5AA8"/>
    <rect x="118" y="256" width="24" height="40" rx="6" fill="#1E5AA8"/>
    <rect x="104" y="296" width="52" height="14" rx="4" fill="#E53935"/>

    <!-- right assembly -->
    <line x1="430" y1="162" x2="402" y2="238" stroke="#0B2341" stroke-width="6" stroke-linecap="round"/>
    <line x1="430" y1="162" x2="458" y2="238" stroke="#0B2341" stroke-width="6" stroke-linecap="round"/>
    <path d="M384 238 h92 v12 a46 12 0 0 1 -92 0z" fill="#0b2341"/>
    <ellipse cx="430" cy="250" rx="46" ry="11" fill="#1E5AA8"/>
    <rect x="418" y="256" width="24" height="40" rx="6" fill="#1E5AA8"/>
    <rect x="404" y="296" width="52" height="14" rx="4" fill="#E53935"/>
  </g>

  <!-- Gavel on the right -->
  <g transform="translate(470 330) rotate(-14)">
    <rect x="-10" y="-96" width="20" height="96" rx="8" fill="#1E5AA8"/>
    <rect x="-34" y="-116" width="68" height="30" rx="8" fill="#0B2341"/>
    <rect x="-34" y="-96" width="68" height="10" rx="4" fill="#E53935" opacity="0.0"/>
  </g>

  <!-- Law banner -->
  <g transform="translate(214 388)">
    <rect width="134" height="40" rx="10" fill="#0B2341"/>
    <text x="67" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#FFFFFF" letter-spacing="3">LAW</text>
  </g>
</svg>