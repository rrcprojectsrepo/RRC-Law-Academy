<svg width="560" height="480" viewBox="0 0 560 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a current affairs newspaper with legal awareness highlights">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F8FC"/>
      <stop offset="1" stop-color="#E4ECF7"/>
    </linearGradient>
  </defs>

  <rect width="560" height="480" rx="18" fill="url(#bg)"/>
  <circle cx="90" cy="90" r="130" fill="#1E5AA8" fill-opacity="0.06"/>
  <circle cx="480" cy="400" r="120" fill="#E53935" fill-opacity="0.06"/>

  <!-- Back newspaper -->
  <g transform="translate(60 120) rotate(-6)">
    <rect width="240" height="300" rx="10" fill="#ffffff" stroke="#D7E1EE" stroke-width="3"/>
    <rect x="24" y="26" width="120" height="14" rx="3" fill="#1E5AA8"/>
    <rect x="24" y="52" width="70" height="8" rx="3" fill="#cbd8ea"/>
    <rect x="24" y="68" width="190" height="8" rx="3" fill="#cbd8ea"/>
    <rect x="24" y="84" width="180" height="8" rx="3" fill="#cbd8ea"/>
    <rect x="24" y="110" width="90" height="60" rx="6" fill="#0B2341"/>
    <rect x="24" y="182" width="60" height="8" rx="3" fill="#cbd8ea"/>
    <rect x="24" y="198" width="190" height="8" rx="3" fill="#cbd8ea"/>
    <rect x="24" y="214" width="170" height="8" rx="3" fill="#cbd8ea"/>
  </g>

  <!-- Front newspaper -->
  <g transform="translate(160 60) rotate(3)">
    <rect width="300" height="380" rx="14" fill="#ffffff" stroke="#bccbde" stroke-width="4"/>
    <rect x="24" y="22" width="160" height="22" rx="5" fill="#0B2341"/>
    <rect x="24" y="54" width="130" height="10" rx="4" fill="#1E5AA8"/>
    <rect x="24" y="72" width="252" height="10" rx="4" fill="#cbd8ea"/>
    <rect x="24" y="90" width="230" height="10" rx="4" fill="#cbd8ea"/>

    <!-- Main article image -->
    <rect x="24" y="118" width="252" height="120" rx="8" fill="#0B2341"/>
    <circle cx="150" cy="178" r="28" fill="#E53935"/>
    <path d="M150 150 l18 56 h-36 z" fill="#ffffff"/>
    <line x1="60" y1="150" x2="240" y2="150" stroke="#2f74c4" stroke-width="3" stroke-linecap="round"/>

    <rect x="24" y="254" width="70" height="9" rx="4" fill="#E53935"/>
    <rect x="24" y="272" width="240" height="9" rx="4" fill="#cbd8ea"/>
    <rect x="24" y="290" width="220" height="9" rx="4" fill="#cbd8ea"/>
    <rect x="24" y="316" width="80" height="34" rx="6" fill="#1E5AA8"/>
    <path d="M154 322 l4 4 8 -9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Calendar chip -->
  <g transform="translate(420 80) rotate(6)">
    <rect width="86" height="96" rx="12" fill="#E53935"/>
    <rect width="86" height="28" rx="12" fill="#c62828"/>
    <rect x="12" y="40" width="62" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="12" y="58" width="46" height="8" rx="4" fill="#ffffff" opacity="0.65"/>
    <rect x="20" y="8" width="6" height="16" rx="3" fill="#ffffff"/>
    <rect x="60" y="8" width="6" height="16" rx="3" fill="#ffffff"/>
  </g>

  <!-- Magnifier -->
  <g transform="translate(430 300)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="#0B2341" stroke-width="12"/>
    <line x1="30" y1="30" x2="66" y2="66" stroke="#0B2341" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>