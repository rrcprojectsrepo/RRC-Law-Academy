<svg width="560" height="480" viewBox="0 0 560 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a law academy classroom with students and a teacher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F8FC"/>
      <stop offset="1" stop-color="#E4ECF7"/>
    </linearGradient>
  </defs>

  <rect width="560" height="480" rx="18" fill="url(#bg)"/>

  <!-- Window -->
  <rect x="40" y="40" width="150" height="120" rx="12" fill="#ffffff" stroke="#D7E1EE" stroke-width="4"/>
  <line x1="115" y1="40" x2="115" y2="160" stroke="#D7E1EE" stroke-width="4"/>
  <line x1="40" y1="100" x2="190" y2="100" stroke="#D7E1EE" stroke-width="4"/>

  <!-- Board -->
  <rect x="240" y="44" width="280" height="120" rx="12" fill="#0B2341"/>
  <rect x="256" y="58" width="248" height="92" rx="6" fill="#122e50"/>
  <text x="380" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#a9c4e8">RRC LAW ACADEMY</text>
  <text x="380" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7f9cc4">Constitutional Law</text>
  <line x1="360" y1="126" x2="400" y2="126" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>

  <!-- Teacher -->
  <g transform="translate(90 250)">
    <circle cx="0" cy="-46" r="24" fill="#e7b58a"/>
    <rect x="-34" y="-22" width="68" height="22" rx="6" fill="#0B2341"/>
    <path d="M-34 -22 Q0 -46 34 -22 Z" fill="#0B2341"/>
    <rect x="-30" y="0" width="60" height="86" rx="10" fill="#1E5AA8"/>
    <circle cx="-16" cy="34" r="7" fill="#e7b58a"/>
    <circle cx="16" cy="34" r="7" fill="#e7b58a"/>
    <rect x="-4" y="86" width="8" height="48" rx="4" fill="#0B2341"/>
  </g>

  <!-- Desk -->
  <rect x="222" y="300" width="300" height="16" rx="6" fill="#0B2341"/>
  <rect x="240" y="316" width="14" height="70" rx="4" fill="#1E5AA8"/>
  <rect x="484" y="316" width="14" height="70" rx="4" fill="#1E5AA8"/>

  <!-- Book on desk -->
  <rect x="300" y="288" width="56" height="12" rx="4" fill="#E53935"/>
  <rect x="396" y="284" width="48" height="16" rx="4" fill="#1E5AA8"/>

  <!-- Student 1 -->
  <g transform="translate(330 268)">
    <circle cx="0" cy="-40" r="20" fill="#f2c391"/>
    <rect x="-30" y="-18" width="60" height="18" rx="6" fill="#0B2341"/>
    <rect x="-26" y="0" width="52" height="70" rx="10" fill="#2f74c4"/>
  </g>

  <!-- Student 2 -->
  <g transform="translate(430 268)">
    <circle cx="0" cy="-40" r="20" fill="#c97b50"/>
    <path d="M-20 -26 Q0 -54 20 -26 Z" fill="#0B2341"/>
    <rect x="-26" y="0" width="52" height="70" rx="10" fill="#E53935"/>
  </g>

  <!-- Floating document with checklist -->
  <g transform="translate(120 380) rotate(-4)">
    <rect width="120" height="74" rx="8" fill="#ffffff" stroke="#D7E1EE" stroke-width="3"/>
    <rect x="14" y="12" width="28" height="10" rx="3" fill="#E53935"/>
    <rect x="14" y="30" width="40" height="8" rx="3" fill="#cbd8ea"/>
    <rect x="14" y="46" width="34" height="8" rx="3" fill="#cbd8ea"/>
    <circle cx="96" cy="18" r="9" fill="#18A558"/>
    <path d="M91 18 l4 4 l7 -8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stars decorative -->
  <path d="M46 222 l6 12 13 2 -9 9 2 13 -12 -6 -12 6 2 -13 -9 -9 13 -2 z" fill="#E53935" opacity="0.75"/>
  <path d="M140 214 l4 8 9 1 -6 6 1 9 -8 -4 -8 4 1 -9 -6 -6 9 -1 z" fill="#1E5AA8" opacity="0.5"/>
</svg>